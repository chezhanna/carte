<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chez Hanna — La Carte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,600;1,700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#f6efe1; --paper:#fbf7ee; --line:#e6dcc6;
  --red:#9b0c1f; --pink:#c4164a; --green:#3d5a1e; --ink:#2b2622; --muted:#8a7f72; --en:#b0566c;
  --spec:#f08a2b;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--cream);color:var(--ink);font-family:Poppins,system-ui,sans-serif;font-size:14px;line-height:1.45}
.wrap{max-width:980px;margin:0 auto;padding:0 18px 40px}

/* Header */
header{text-align:center;padding:26px 0 10px}
header img{width:96px;height:96px;display:block;margin:0 auto 8px}
header h1{font-family:Lora,serif;font-style:italic;font-weight:700;color:var(--pink);font-size:34px;line-height:1.1}
header p{color:var(--muted);font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin-top:6px}
.leaf{display:flex;align-items:center;justify-content:center;gap:10px;margin:10px auto 0;color:var(--green)}
.leaf::before,.leaf::after{content:"";width:46px;height:1px;background:var(--green);opacity:.5}

/* Sticky bar */
.bar{position:sticky;top:0;z-index:5;background:rgba(246,239,225,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);margin:14px -18px 0;padding:10px 18px 0}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:10px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:500 13px Poppins,sans-serif;padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:.15s}
.tab:hover{border-color:var(--red)}
.tab[aria-selected=true]{background:var(--red);border-color:var(--red);color:#fff}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-bottom:10px}
.search{flex:1 1 200px;position:relative}
.search input{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px 8px 32px;font:13px Poppins,sans-serif;color:var(--ink);outline:none}
.search input:focus{border-color:var(--red)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.5}
.chip{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 11px;font:500 12px Poppins,sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.chip[aria-pressed=true]{background:var(--green);border-color:var(--green);color:#fff}
.chip.spec[aria-pressed=true]{background:var(--spec);border-color:var(--spec)}
.lang{margin-left:auto;display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.lang button{border:0;background:none;padding:7px 10px;font:600 12px Poppins,sans-serif;cursor:pointer;color:var(--muted)}
.lang button[aria-pressed=true]{background:var(--ink);color:#fff}

/* Badges */
.b{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;font-size:10px;vertical-align:-3px;margin-left:5px;color:#fff}
.b.v{background:var(--green)} .b.s{background:var(--spec)}
.chip .b{margin:0}

/* Sections */
.section{margin-top:26px}
.section h2{font-family:Lora,serif;font-style:italic;font-weight:700;color:var(--pink);font-size:26px;display:flex;align-items:baseline;gap:12px}
.section h2 small{font:500 11px Poppins,sans-serif;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;font-style:normal}
.note{color:var(--muted);font-size:12px;margin-top:2px}
.group{margin-top:16px}
.group h3{font:600 11px Poppins,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--green);display:flex;align-items:center;gap:10px;margin-bottom:6px}
.group h3::after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 28px}
@media(max-width:700px){.grid{grid-template-columns:1fr}header h1{font-size:28px}.search{flex-basis:100%}.lang{margin-left:auto}header img{width:76px;height:76px}}
.item{padding:10px 0;border-bottom:1px dashed var(--line);break-inside:avoid}
.item.hl{background:linear-gradient(90deg,rgba(240,138,43,.10),transparent);margin:0 -8px;padding:10px 8px;border-radius:6px}
.row{display:flex;align-items:baseline;gap:8px}
.name{font-weight:600;font-size:13.5px;text-transform:uppercase;letter-spacing:.02em}
.dots{flex:1;border-bottom:1px dotted #c9bda6;transform:translateY(-3px);min-width:12px}
.price{font-weight:600;color:var(--red);white-space:nowrap}
.desc{font-family:Lora,serif;font-size:13.5px;color:#4a423b;margin-top:2px}
.desc.en{font-style:italic;color:var(--en);font-size:12.5px}
.sizes{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.sizes span{font-size:12px;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.sizes b{color:var(--red);font-weight:600}

/* Wines table */
.wines{width:100%;border-collapse:collapse;margin-top:6px;font-size:13px}
.wines th{font:600 10px Poppins,sans-serif;letter-spacing:.1em;color:var(--muted);text-align:right;padding:4px 6px;text-transform:uppercase}
.wines th:first-child{text-align:left}
.wines td{padding:8px 6px;border-bottom:1px dashed var(--line);text-align:right;color:var(--red);font-weight:600;white-space:nowrap}
.wines td:first-child{text-align:left;color:var(--ink);white-space:normal}
.wines td:first-child small{display:block;font-family:Lora,serif;font-style:italic;font-weight:500;color:var(--muted)}
.wines .sub td{color:var(--en);font-family:Lora,serif;font-style:italic;font-weight:600;border:0;padding-top:12px}
.tablewrap{overflow-x:auto}

.empty{text-align:center;color:var(--muted);padding:40px 0;font-family:Lora,serif;font-style:italic}
footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:12px;line-height:1.8}
footer .legend{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-bottom:6px;color:var(--ink)}
</style>
</head>

const T = {
 fr:{title:"La Carte",sub:"Cuisine méditerranéenne maison · depuis 1987",veg:"Végétarien",spec:"Spécialités",vegL:"Plats végétariens",specL:"Nos spécialités",
     allerg:"Allergènes : renseignements auprès de notre équipe",alcohol:"L'abus d'alcool est dangereux pour la santé, à consommer avec modération",
     ph:"Rechercher un plat…",empty:"Aucun plat ne correspond à votre recherche.",results:"Résultats",glass:"Verre",bottle:"Bouteille"},
 en:{title:"Our Menu",sub:"Homemade Mediterranean cuisine · since 1987",veg:"Vegetarian",spec:"Specialties",vegL:"Vegetarian dishes",specL:"Our specialties",
     allerg:"Please ask our staff about allergens",alcohol:"Alcohol abuse is dangerous to your health, please drink responsibly",
     ph:"Search a dish…",empty:"No dish matches your search.",results:"Results",glass:"Glass",bottle:"Bottle"}
};

let st = {tab:'entrees', lang:'fr', q:'', v:false, s:false};
try{ const h=location.hash.slice(1); if(MENU.some(c=>c.id===h)) st.tab=h; }catch(e){}

const $ = s=>document.querySelector(s);
const eur = p => (p%1? p.toFixed(2).replace('.',',') : p) + ' €';
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');

function itemHTML(it){
  const L=st.lang, en=L==='en';
  const badges=(it.f.includes('v')?'<span class="b v" title="Végétarien">✿</span>':'')+(it.f.includes('s')?'<span class="b s" title="Spécialité">♥</span>':'');
  const desc = en ? (it.den?`<div class="desc">${esc(it.den)}</div>`:'')
                  : (it.dfr?`<div class="desc">${esc(it.dfr)}</div>`:'') + (it.den?`<div class="desc en">${esc(it.den)}</div>`:'');
  const price = it.p!=null?`<span class="dots"></span><span class="price">${eur(it.p)}</span>`:'';
  const sizes = it.sizes?`<div class="sizes">${it.sizes.map(([s,p])=>`<span>${s} · <b>${eur(p)}</b></span>`).join('')}</div>`:'';
  return `<div class="item${it.f.includes('s')?' hl':''}"><div class="row"><span class="name">${esc(it.n)}${badges}</span>${price}</div>${desc}${sizes}</div>`;
}
function match(it){
  if(st.v && !it.f.includes('v')) return false;
  if(st.s && !it.f.includes('s')) return false;
  if(st.q){ const q=norm(st.q); return [it.n,it.dfr,it.den].some(x=>norm(x).includes(q)); }
  return true;
}
function winesHTML(c){
  const L=st.lang;
  return c.wines.map(w=>`<div class="group"><h3>${esc(w[L])}</h3><div class="tablewrap"><table class="wines">
   <thead><tr><th></th>${w.cols.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>
   ${w.rows.map(r=>r.sub?`<tr class="sub"><td colspan="${w.cols.length+1}">${r.sub[L==='en'?1:0]}</td></tr>`
     :`<tr><td>${esc(r[0])}${r[1]?`<small>${esc(r[1])}</small>`:''}</td>${r[2].map(p=>`<td>${p==null?'<span style="color:#c9bda6">–</span>':eur(p)}</td>`).join('')}</tr>`).join('')}
   </tbody></table></div></div>`).join('');
}
function sectionHTML(c, filtered){
  const L=st.lang;
  let body='';
  if(c.wines){ if(filtered) return ''; body=winesHTML(c); }
  else{
    for(const g of c.groups){
      const items=g.items.filter(match); if(!items.length) continue;
      body+=`<div class="group">${g[L]?`<h3>${esc(g[L])}</h3>`:''}<div class="grid">${items.map(itemHTML).join('')}</div></div>`;
    }
    if(!body) return '';
  }
  return `<section class="section"><h2>${esc(c[L])}${L==='fr'&&!filtered?`<small>${esc(c.en)}</small>`:''}</h2>${c.note?`<div class="note">${esc(c.note[L])}</div>`:''}${body}</section>`;
}
function render(){
  const L=st.lang, filtered = !!(st.q||st.v||st.s);
  $('#tabs').innerHTML = MENU.map(c=>`<button class="tab" role="tab" data-id="${c.id}" aria-selected="${!filtered&&c.id===st.tab}">${esc(c[L])}</button>`).join('');
  let html = filtered ? MENU.map(c=>sectionHTML(c,true)).join('') : sectionHTML(MENU.find(c=>c.id===st.tab),false);
  $('#out').innerHTML = html || `<div class="empty">${T[L].empty}</div>`;
  document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=T[L][e.dataset.i18n]);
  $('#q').placeholder=T[L].ph; document.documentElement.lang=L;
}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('.tab'); if(!b) return;
  st.tab=b.dataset.id; st.q=''; st.v=st.s=false; $('#q').value=''; $('#fv').ariaPressed=$('#fs').ariaPressed='false';
  try{history.replaceState(null,'','#'+st.tab)}catch(_){}
  render(); b.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
  const bar=document.querySelector('.bar'); if(window.scrollY>bar.offsetTop) window.scrollTo({top:bar.offsetTop,behavior:'smooth'});});
$('#q').addEventListener('input',e=>{st.q=e.target.value.trim(); render();});
$('#fv').addEventListener('click',e=>{st.v=!st.v; e.currentTarget.ariaPressed=st.v; render();});
$('#fs').addEventListener('click',e=>{st.s=!st.s; e.currentTarget.ariaPressed=st.s; render();});
document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>{st.lang=b.dataset.l;
  document.querySelectorAll('.lang button').forEach(x=>x.ariaPressed=x===b); render();}));
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1); if(MENU.some(c=>c.id===h)){st.tab=h;render();}});
render();
</script>
